<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a12">
  <title>我的电台</title>
  <link rel="icon" href="/placeholder.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
  <div class="bg-layer" id="bgLayerA" aria-hidden="true"></div>
  <div class="bg-layer" id="bgLayerB" aria-hidden="true"></div>
  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="grid-lines"></div>
  </div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="brand-text">
          <h1 id="stationName">我的电台</h1>
          <p id="stationSubtitle" class="station-subtitle"></p>
        </div>
      </div>
      <div class="top-actions">
        <div class="sync-pill" id="syncStatus" data-state="connecting">连接中</div>
        <button id="nicknameBtn" class="text-btn" type="button">设置昵称</button>
        <button id="adminBtn" class="icon-btn" type="button" aria-label="管理面板" title="管理面板">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2A3.8 3.8 0 1 0 12 15.8 3.8 3.8 0 0 0 12 8.2Zm9 4.9v-2.2l-2.4-.6a7.4 7.4 0 0 0-.8-1.9l1.3-2.1-1.6-1.6-2.1 1.3a7.4 7.4 0 0 0-1.9-.8L12.9 3h-1.8l-.6 2.4a7.4 7.4 0 0 0-1.9.8L6.5 4.9 4.9 6.5l1.3 2.1a7.4 7.4 0 0 0-.8 1.9L3 11.1v2.2l2.4.6c.2.7.5 1.3.8 1.9l-1.3 2.1 1.6 1.6 2.1-1.3c.6.4 1.2.6 1.9.8l.6 2.4h1.8l.6-2.4c.7-.2 1.3-.5 1.9-.8l2.1 1.3 1.6-1.6-1.3-2.1c.4-.6.6-1.2.8-1.9l2.4-.6Z"/></svg>
        </button>
      </div>
    </header>

    <div id="noticeBar" class="notice hidden"></div>

    <main class="grid">
      <section class="card player-card">
        <div class="cover-block">
          <img id="cover" src="/placeholder.svg" alt="当前曲目封面">
          <span class="source-badge" id="sourceBadge">待机</span>
        </div>
        <div class="player-main">
          <div class="eyebrow-row">
            <span class="eyebrow">正在播放</span>
            <span class="live-pill" id="livePill" data-state="idle">待机</span>
          </div>
          <h2 id="title">等待开播</h2>
          <p id="artist" class="artist">--</p>
          <p id="album" class="album">--</p>

          <div class="timeline">
            <div class="time-row">
              <span id="position">00:00</span>
              <span id="duration">--:--</span>
            </div>
            <div class="progress" id="progressTrack" role="progressbar" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div class="controls">
            <button id="playBtn" class="play-btn" type="button" aria-label="播放">
              <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.2-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3C8.9 3.9 8 4.4 8 5.2Z"/></svg>
              <svg class="icon icon-pause hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h3.6v15H7zM13.4 4.5H17v15h-3.6z"/></svg>
            </button>
            <div class="volume">
              <button id="muteBtn" class="icon-btn" type="button" aria-label="静音">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2l4.3 3.5c.7.6 1.8.1 1.8-.8V6.8c0-.9-1.1-1.4-1.8-.8L7.2 9.5H4Zm12.1-1.9a6.2 6.2 0 0 1 0 8.8l1.4 1.4a8.2 8.2 0 0 0 0-11.6l-1.4 1.4Z"/></svg>
              </button>
              <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量">
            </div>
            <div class="controls-meta">
              <span id="audioMode">等待音频</span>
              <a id="audioLink" href="#" target="_blank" rel="noreferrer">音频地址</a>
            </div>
          </div>
        </div>
      </section>

      <section class="card lyrics-card">
        <div class="card-head">
          <div>
            <h3>歌词</h3>
          </div>
          <button id="translationToggle" class="ghost-btn" type="button" aria-pressed="true">双语</button>
        </div>
        <div class="lyrics-scroll" id="lyricsScroll">
          <div class="lyrics" id="lyrics">
            <p class="lyrics-empty">等待开播</p>
          </div>
        </div>
      </section>

      <section class="card queue-card">
        <div class="card-head">
          <div>
            <h3>接下来</h3>
          </div>
          <span class="count-pill" id="queueCount">0</span>
        </div>
        <div id="queueList" class="queue-list">
          <p class="empty">队列还是空的</p>
        </div>
      </section>

      <section class="card request-card">
        <div class="card-head">
          <div>
            <h3>点歌</h3>
          </div>
        </div>
        <form id="searchForm" class="search-form" autocomplete="off">
          <input id="searchInput" maxlength="80" placeholder="搜索歌名或歌手" aria-label="搜索歌曲">
          <button id="searchBtn" type="submit">搜索</button>
        </form>
        <p id="searchStatus" class="form-status" role="status"></p>
        <div id="searchResults" class="search-results">
          <p class="empty">输入关键词，选择一首歌加入队列</p>
        </div>
        <div id="selectBar" class="select-bar hidden">
          <span id="selectedTrack" class="selected-track"></span>
          <button id="requestBtn" type="button">确认点歌</button>
        </div>
      </section>

      <section class="card messages-card">
        <div class="card-head">
          <div>
            <h3>留言</h3>
          </div>
          <span id="messageIdentity" class="identity-pill"></span>
        </div>
        <form id="messageForm" class="message-form" autocomplete="off">
          <textarea id="messageInput" maxlength="200" rows="3" placeholder="写点什么"></textarea>
          <div class="form-foot">
            <p id="messageStatus" class="form-status" role="status"></p>
            <button id="messageBtn" type="submit">发送留言</button>
          </div>
        </form>
        <div id="messageList" class="message-list">
          <p class="empty">还没有留言</p>
        </div>
      </section>
    </main>
  </div>

  <audio id="audio" preload="none"></audio>

  <div id="nicknameModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="nicknameTitle">
    <div class="modal-card">
      <p class="kicker">PROFILE</p>
      <h2 id="nicknameTitle">先起个昵称</h2>
      <p class="modal-copy">昵称只保存在这台设备的浏览器里，用来点歌和留言。</p>
      <input id="nicknameInput" maxlength="16" placeholder="例如：夜航" autocomplete="nickname">
      <p id="nicknameStatus" class="form-status" role="status"></p>
      <div class="modal-actions">
        <button id="nicknameSave" class="primary-btn" type="button">保存昵称</button>
      </div>
    </div>
  </div>

  <div id="adminModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <div class="modal-card admin-card">
      <div class="modal-head">
        <h2 id="adminTitle">管理面板</h2>
        <button id="adminClose" class="icon-btn" type="button" aria-label="关闭">×</button>
      </div>

      <div id="adminLogin">
        <p class="modal-copy">输入管理 token 后可以控制播放、修改页面文字和上传背景。</p>
        <input id="adminToken" type="password" placeholder="管理 token" autocomplete="current-password">
        <div class="modal-actions">
          <button id="adminLoginBtn" class="primary-btn" type="button">登录</button>
        </div>
        <p id="adminLoginStatus" class="form-status" role="status"></p>
      </div>

      <div id="adminPanel" class="hidden">
        <div class="admin-tabs" role="tablist">
          <button type="button" data-tab="control" class="active">播放</button>
          <button type="button" data-tab="text">页面文字</button>
          <button type="button" data-tab="background">背景</button>
          <button type="button" data-tab="messages">留言</button>
        </div>

        <section id="tab-control" class="admin-tab">
          <div id="adminNow" class="admin-now"></div>
          <div class="admin-actions">
            <button id="adminSkip" class="primary-btn" type="button">切歌</button>
            <button id="adminPause" type="button">暂停</button>
            <button id="adminResume" type="button">恢复</button>
            <button id="adminClearQueue" type="button">清空队列</button>
          </div>
          <h3>队列</h3>
          <div id="adminQueue" class="admin-list"></div>
          <h3>加入播放列表</h3>
          <form id="adminSearchForm" class="search-form" autocomplete="off">
            <input id="adminSearchInput" maxlength="80" placeholder="搜索歌名或歌手">
            <button type="submit">搜索</button>
          </form>
          <p id="adminSearchStatus" class="form-status" role="status"></p>
          <div id="adminSearchResults" class="search-results compact"></div>
        </section>

        <section id="tab-text" class="admin-tab hidden">
          <label>电台名称<input id="setStationName" maxlength="40"></label>
          <label>副标题<input id="setSubtitle" maxlength="80"></label>
          <label>页面标题<input id="setPageTitle" maxlength="60"></label>
          <label>公告<textarea id="setNotice" maxlength="300" rows="3"></textarea></label>
          <label>背景轮换间隔（秒）<input id="setBgInterval" type="number" min="30" max="86400"></label>
          <div class="modal-actions">
            <button id="saveSettings" class="primary-btn" type="button">保存页面设置</button>
          </div>
          <p id="settingsStatus" class="form-status" role="status"></p>
        </section>

        <section id="tab-background" class="admin-tab hidden">
          <label>上传背景图片（JPG / PNG / WEBP）<input id="bgFile" type="file" accept="image/jpeg,image/png,image/webp"></label>
          <div class="modal-actions">
            <button id="bgUpload" class="primary-btn" type="button">上传背景</button>
          </div>
          <p id="bgStatus" class="form-status" role="status"></p>
          <div id="bgGallery" class="bg-gallery"></div>
        </section>

        <section id="tab-messages" class="admin-tab hidden">
          <div id="adminMessages" class="admin-list"></div>
        </section>

        <div class="admin-footer">
          <button id="adminLogout" class="ghost-btn" type="button">退出管理</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js?v=3"></script>
</body>
</html>
