# Radio on Stick network admission list.
# Installed to /etc/nginx/snippets/radio-allow.conf.
# The installer preserves this file across upgrades so site-specific
# Tailscale / LAN ranges are not overwritten.
allow 127.0.0.1;
allow ::1;
# Tailscale CGNAT and IPv6 range.
allow 100.64.0.0/10;
allow fd7a:115c:a1e0::/48;
# RFC1918 private networks.
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
deny all;
