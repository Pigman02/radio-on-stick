# Radio on Stick
# Installed to /etc/nginx/sites-available/radio-on-stick
# The Python service must only listen on 127.0.0.1:8080.

upstream radio_backend {
    server 127.0.0.1:8080;
    keepalive 8;
}

limit_req_zone $binary_remote_addr zone=radio_api:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=radio_conn:1m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    root /opt/radio-on-stick/app/static;
    index index.html;

    access_log /var/log/nginx/radio.access.log;
    error_log /var/log/nginx/radio.error.log warn;

    # Tailscale + private LAN only. Adjust if your LAN uses another range.
    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: http:; media-src https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'self';" always;

    gzip on;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location = /now.json {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        access_log off;
    }

    location = /api/report {
        limit_req zone=radio_api burst=20 nodelay;
        limit_conn radio_conn 20;
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        access_log off;
    }

    location /api/ {
        limit_req zone=radio_api burst=20 nodelay;
        limit_conn radio_conn 20;
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /admin {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        expires -1;
    }

    location = /admin/ {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        expires -1;
    }

    location ^~ /backgrounds/ {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        expires 1d;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ @radio_app;
    }

    location @radio_app {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
