# Radio on Stick
# Installed to /etc/nginx/sites-available/radio-on-stick
# The Python service must only listen on 127.0.0.1:8090.

upstream radio_backend {
    server 127.0.0.1:8090;
    keepalive 8;
}

limit_req_zone $binary_remote_addr zone=radio_api:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=radio_conn:1m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/radio-on-stick/tls/fullchain.pem;
    ssl_certificate_key /etc/radio-on-stick/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:RadioTLS:4m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 120s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    root /opt/radio-on-stick/app/static;
    index index.html;

    access_log /var/log/nginx/radio.access.log;
    error_log /var/log/nginx/radio.error.log warn;

    # Site-specific admission list; preserved across upgrades.
    include /etc/nginx/snippets/radio-allow.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: http:; media-src 'self' blob: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'self';" always;

    gzip on;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location = /now.json {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        access_log off;
    }

    location = /api/report {
        limit_req zone=radio_api burst=20 nodelay;
        limit_conn radio_conn 20;
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        access_log off;
    }

    # Stream large uploads straight through instead of buffering them in Nginx.
    location = /api/upload {
        limit_req zone=radio_api burst=5 nodelay;
        limit_conn radio_conn 20;
        client_max_body_size 64m;
        client_body_timeout 300s;
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        limit_req zone=radio_api burst=20 nodelay;
        limit_conn radio_conn 20;
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket control plane: SDP/ICE only, no audio bytes.
    location = /ws {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;
    }

    # Server-native fallback audio for AAC/WAV/FLAC and non-MSE browsers.
    location ^~ /native/ {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
        access_log off;
    }

    # Raw audio chunks for the two seed devices.  Do not buffer these in Nginx.
    location ^~ /source/ {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        gzip off;
        access_log off;
        # Bandwidth-limited deployments can tune this per connection, e.g.
        # limit_rate 512k;
    }

    location = /mesh.json {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /admin {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        expires -1;
    }

    location = /admin/ {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        expires -1;
    }

    location ^~ /backgrounds/ {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        expires 1d;
    }

    location ^~ /media/uploads/ {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Cache-Control "no-store";
        add_header Accept-Ranges "bytes";
        # Uploaded audio is server egress; tune this on constrained uplinks.
        # limit_rate 512k;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ @radio_app;
    }

    location @radio_app {
        proxy_pass http://radio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
